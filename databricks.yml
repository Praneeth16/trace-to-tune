bundle:
  name: trace-to-tune

include:
  - resources/*.yml

variables:
  catalog:
    default: serverless_lakebase_praneeth_catalog
  schema:
    default: trace_to_tune
  registered_model:
    default: ${var.catalog}.${var.schema}.skill_router
  max_steps:
    default: 300

targets:
  praneeth:
    default: true
    mode: development
