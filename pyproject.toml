[project]
name = "trace-to-tune"
version = "0.1.0"
description = "Unity Gateway trace-to-fine-tune demo for Databricks"
requires-python = ">=3.12"
dependencies = [
  "databricks-sdk>=0.125.0",
  "openai>=1.107.0",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_to_tune"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
